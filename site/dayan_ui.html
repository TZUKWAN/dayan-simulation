<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>大衍 DAYAN — 操作台</title>
<style>
:root{--bg:#04070f;--card:#0d1526;--edge:#1b2a4a;--txt:#d8e2f2;--sub:#6b7fa3;
--cy:#00e5ff;--gr:#00ffa3;--rd:#ff4d6d;--or:#ffb74d;--pu:#c084fc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI','Microsoft YaHei',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:12px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:linear-gradient(rgba(30,60,110,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,60,110,.07) 1px,transparent 1px);background-size:36px 36px}
#top{height:40px;display:flex;align-items:center;padding:0 14px;gap:10px;z-index:2;
background:linear-gradient(135deg,#060b18,#101a35,#060b18);
border-bottom:1px solid rgba(0,229,255,.25);box-shadow:0 2px 18px rgba(0,229,255,.18)}
.lg{font-size:16px;font-weight:800;letter-spacing:2px;
background:linear-gradient(90deg,#00e5ff,#c084fc,#00ffa3,#00e5ff);background-size:300% 100%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:hue 6s linear infinite;
filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
@keyframes hue{0%{background-position:0 0}100%{background-position:300% 0}}
.chip{padding:1px 10px;border-radius:12px;font-size:9px;font-weight:700;letter-spacing:1px}
.chip.cy{background:rgba(0,229,255,.08);color:var(--cy);border:1px solid rgba(0,229,255,.35);box-shadow:0 0 8px rgba(0,229,255,.25)}
.chip.gr{background:rgba(0,255,163,.08);color:var(--gr);border:1px solid rgba(0,255,163,.35);box-shadow:0 0 8px rgba(0,255,163,.25)}
#main{display:flex;flex:1;overflow:hidden;z-index:1}
#colL{width:270px;background:#080e1c;border-right:1px solid rgba(0,229,255,.2);display:flex;flex-direction:column}
#search{margin:8px;padding:6px 8px;background:#04070f;border:1px solid var(--edge);border-radius:5px;color:var(--txt);font-size:11px;outline:none}
#search:focus{border-color:var(--cy);box-shadow:0 0 8px rgba(0,229,255,.3)}
.filters{display:flex;gap:4px;padding:0 8px 6px}
.fbtn{flex:1;padding:3px;border-radius:4px;border:1px solid var(--edge);background:transparent;color:var(--sub);font-size:9px;cursor:pointer}
.fbtn.on{color:var(--cy);border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.08)}
#mlist{flex:1;overflow-y:auto;padding:4px}
#mlist::-webkit-scrollbar{width:5px}
#mlist::-webkit-scrollbar-thumb{background:#1e325c;border-radius:3px}
.mitem{padding:4px 8px;border-radius:5px;cursor:pointer;font-size:10px;color:var(--sub);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.mitem:hover{background:rgba(0,229,255,.06);color:var(--txt)}
.mitem.sel{background:rgba(0,229,255,.12);color:var(--cy);border:1px solid rgba(0,229,255,.35)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.run{background:var(--gr);box-shadow:0 0 5px var(--gr)}
.dot.reg{background:#3d5378}
.mid{font-family:Consolas,monospace;font-size:9px;color:var(--sub);margin-left:auto}
#ctl{padding:8px;border-top:1px solid rgba(0,229,255,.15)}
#ctl label{font-size:9px;color:var(--sub)}
#ticks{width:100%;padding:4px 6px;margin:3px 0;background:#04070f;border:1px solid var(--edge);border-radius:4px;color:var(--txt);font-size:10px}
#runbtn{width:100%;padding:7px;margin-top:4px;background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(192,132,252,.2));
border:1px solid rgba(0,229,255,.55);border-radius:6px;color:var(--cy);font-weight:800;font-size:12px;cursor:pointer;
text-shadow:0 0 8px rgba(0,229,255,.6);box-shadow:0 0 14px rgba(0,229,255,.2)}
#runbtn:hover{box-shadow:0 0 20px rgba(0,229,255,.45)}
#runbtn:disabled{opacity:.4;cursor:wait}
#colC{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#colC::-webkit-scrollbar{width:5px}
#colC::-webkit-scrollbar-thumb{background:#1e325c;border-radius:3px}
.card{background:linear-gradient(180deg,rgba(20,32,58,.9),rgba(10,17,32,.95));
border:1px solid var(--edge);border-radius:8px;padding:8px 10px;
box-shadow:0 0 14px rgba(0,60,140,.18),inset 0 0 24px rgba(0,40,100,.10)}
.card h6{color:var(--cy);font-size:10px;letter-spacing:1px;text-shadow:0 0 8px rgba(0,229,255,.55)}
#statsRow{display:flex;gap:6px;flex-wrap:wrap}
.sc{flex:1;min-width:90px;background:linear-gradient(180deg,rgba(20,32,58,.9),rgba(10,17,32,.95));
border:1px solid var(--edge);border-radius:8px;padding:6px 8px;text-align:center;position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--sc,#00e5ff);opacity:.6;box-shadow:0 0 8px var(--sc,#00e5ff)}
.sc .n{font-size:14px;font-weight:800;font-family:Consolas,monospace;color:var(--sc,#00e5ff);text-shadow:0 0 10px var(--sc,#00e5ff)}
.sc .l{font-size:7px;color:var(--sub);letter-spacing:1px}
#colR{width:250px;background:linear-gradient(180deg,#080e1c,#050a14);border-left:1px solid rgba(0,229,255,.2);display:flex;flex-direction:column}
#chatHead{padding:7px 10px;border-bottom:1px solid rgba(0,229,255,.15)}
#chatHead b{color:var(--or);font-size:10px;text-shadow:0 0 8px rgba(255,183,77,.6)}
#chat{flex:1;overflow-y:auto;padding:7px}
#chat::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb{background:#1e325c}
.m{padding:4px 9px;border-radius:7px;font-size:10px;line-height:1.5;max-width:96%;word-break:break-word;margin-bottom:4px}
.m.u{background:rgba(30,80,160,.25);border:1px solid rgba(96,165,250,.35)}
.m.a{background:rgba(20,32,58,.7);border:1px solid var(--edge)}
#chatTx{width:96%;padding:4px 7px;background:#04070f;border:1px solid var(--edge);border-radius:5px;color:var(--txt);font-size:10px;outline:none}
#chatTx:focus{border-color:var(--cy);box-shadow:0 0 8px rgba(0,229,255,.35)}
.sendbtn{margin-top:4px;width:100%;padding:4px;background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(192,132,252,.15));
border:1px solid rgba(0,229,255,.45);border-radius:5px;color:var(--cy);font-size:10px;font-weight:700;cursor:pointer;
text-shadow:0 0 6px rgba(0,229,255,.6)}
#foot{height:20px;display:flex;align-items:center;padding:0 12px;background:#050a14;border-top:1px solid rgba(0,229,255,.15);font-size:8px;color:#3d5378;gap:8px;z-index:2}
.dot2{width:5px;height:5px;border-radius:50%;background:var(--gr);box-shadow:0 0 6px var(--gr);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head><body>

<div id="top">
  <span class="lg">大衍 DAYAN</span>
  <span style="color:var(--sub);font-size:10px;letter-spacing:2px">仿真操作台 · SIMULATION CONSOLE</span>
  <span style="flex:1"></span>
  <span class="chip cy" id="chipCat">目录载入中…</span>
  <span class="chip gr" id="chipRun">可运行 …</span>
</div>

<div id="main">
  <div id="colL">
    <input id="search" placeholder="搜索模型 ID / 名称…">
    <div class="filters">
      <button class="fbtn on" data-f="all">全部</button>
      <button class="fbtn" data-f="runnable">可运行</button>
      <button class="fbtn" data-f="ok">已验证</button>
      <button class="fbtn" data-f="reg">仅登记</button>
    </div>
    <div id="mlist"></div>
    <div id="ctl">
      <label>仿真步数 ticks</label>
      <input id="ticks" type="number" value="200" min="10" max="500">
      <button id="runbtn" disabled>▶ 运行仿真</button>
    </div>
  </div>

  <div id="colC">
    <div id="statsRow">
      <div class="sc" style="--sc:#00e5ff"><div class="n">—</div><div class="l">当前模型</div></div>
      <div class="sc" style="--sc:#ffb74d"><div class="n">—</div><div class="l">OBSERVATIONS</div></div>
      <div class="sc" style="--sc:#00ffa3"><div class="n">—</div><div class="l">数值字段</div></div>
      <div class="sc" style="--sc:#c084fc"><div class="n">—</div><div class="l">状态</div></div>
    </div>
    <div class="card"><h6 id="chartTitle">运行结果 — 选择左侧模型并点击运行</h6><canvas id="chart"></canvas></div>
    <div class="card"><h6>字段诊断（最终值）</h6><div id="diag" style="font-family:Consolas,monospace;font-size:10px;color:#9db0cc;line-height:1.7">—</div></div>
  </div>

  <div id="colR">
    <div id="chatHead"><b>◈ AI 助手</b><span style="color:var(--sub);font-size:9px;margin-left:5px">自然语言操作</span></div>
    <div id="chat"></div>
    <div style="padding:5px;border-top:1px solid rgba(0,229,255,.15)">
      <input id="chatTx" placeholder="输入指令…">
      <button class="sendbtn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<div id="foot">
  <span class="dot2"></span><span style="color:var(--gr)">ONLINE</span>
  <span>大衍 DAYAN v2.0</span><span>·</span><span>五范式 ABM·SD·博弈·运筹·CA</span><span>·</span><span>三主权 ✓</span>
  <span style="flex:1"></span><span id="footStat">…</span>
</div>

<script>
"use strict";
let CATALOG = [];
let RUNNABLE = new Set();
let filter = 'all';
let query = '';
let selected = null;

const $ = id => document.getElementById(id);
const CC = ['#ff4d6d','#00e5ff','#00ffa3','#ffb74d','#c084fc','#38bdf8'];

async function boot(){
  pushBot('你好！这是大衍操作台。左侧选择任意可运行模型（绿点）并点击 ▶ 运行。');
  try{
    const [c1, c2] = await Promise.all([
      fetch('/api/catalog').then(r=>r.json()),
      fetch('/api/models/runnable').then(r=>r.json())
    ]);
    CATALOG = c1.models || [];
    RUNNABLE = new Set((c2.models||[]).map(m=>m.model_id));
    $('chipCat').textContent = '目录 ' + CATALOG.length;
    $('chipRun').textContent = '可运行 ' + RUNNABLE.size;
    $('footStat').textContent = '✓ 目录 ' + CATALOG.length + ' · 可运行 ' + RUNNABLE.size;
    renderList();
  }catch(e){
    $('footStat').textContent = '✗ 目录加载失败';
  }
}

function renderList(){
  const q = query.toLowerCase();
  const list = CATALOG.filter(m=>{
    const run = RUNNABLE.has(m.model_id);
    if(filter==='runnable' && !run) return false;
    if(filter==='ok' && m.status!=='基准通过') return false;
    if(filter==='reg' && m.status!=='仅登记') return false;
    if(q && !m.model_id.toLowerCase().includes(q) && !(m.name||'').toLowerCase().includes(q)) return false;
    return true;
  }).slice(0, 300);
  $('mlist').innerHTML = list.map(m=>{
    const run = RUNNABLE.has(m.model_id);
    return '<div class="mitem'+(selected===m.model_id?' sel':'')+'" data-id="'+m.model_id+'">'
      + '<span class="dot '+(run?'run':'reg')+'"></span>'
      + '<span>'+m.name+'</span><span class="mid">'+m.model_id+'</span></div>';
  }).join('') || '<div style="padding:10px;color:var(--sub);font-size:10px">无匹配模型</div>';
  document.querySelectorAll('.mitem').forEach(el=>{
    el.onclick = ()=>select(el.dataset.id);
  });
}

function select(mid){
  selected = mid;
  const run = RUNNABLE.has(mid);
  $('runbtn').disabled = !run;
  $('runbtn').textContent = run ? '▶ 运行仿真' : '未接入运行工厂';
  renderList();
  const m = CATALOG.find(x=>x.model_id===mid);
  document.querySelector('#statsRow .sc:nth-child(1) .n').textContent = mid;
  document.querySelector('#statsRow .sc:nth-child(1) .l').textContent = m ? (m.name||'').slice(0,14) : '';
  const st = document.querySelector('#statsRow .sc:nth-child(4) .n');
  st.textContent = run ? 'RUN' : (m&&m.status==='基准通过'?'OK':'REG');
  st.style.fontSize = '13px';
}

async function run(){
  if(!selected) return;
  const ticks = Math.max(10, Math.min(500, +$('ticks').value || 200));
  $('runbtn').disabled = true;
  $('runbtn').textContent = '⏳ 运行中…';
  try{
    const r = await fetch('/api/run', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model_id: selected, ticks})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.detail || '运行失败');
    draw(d.observations);
  }catch(e){
    $('chartTitle').textContent = '运行失败：' + e.message;
  }
  $('runbtn').disabled = false;
  $('runbtn').textContent = '▶ 运行仿真';
}

function setupCanvas(cv, h){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth - 20;
  cv.style.width='100%'; cv.style.height=h+'px';
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, W:w, H:h};
}

function draw(obs){
  if(!obs || !obs.length) return;
  const keys = new Set();
  obs.forEach(o=>{ Object.keys(o||{}).forEach(k=>{
    const v = o[k];
    if(typeof v === 'number' && v===v && Math.abs(v) < 1e15) keys.add(k);
  });});
  const fields = [...keys].slice(0,6);
  document.querySelector('#statsRow .sc:nth-child(2) .n').textContent = obs.length;
  document.querySelector('#statsRow .sc:nth-child(3) .n').textContent = fields.length;
  const cv = $('chart');
  const {ctx,W,H} = setupCanvas(cv, 300);
  ctx.fillStyle = '#070d1a'; ctx.fillRect(0,0,W,H);
  $('chartTitle').textContent = '运行结果 — ' + selected + '（' + obs.length + ' obs · ' + fields.length + ' 数值字段）';
  if(!fields.length){
    ctx.fillStyle = '#8fa2c2'; ctx.font='11px sans-serif';
    ctx.fillText('无可绘制数值字段（方法演示型模型请查看下方诊断）', 12, H/2);
    showDiag(obs); return;
  }
  ctx.strokeStyle = '#16233e';
  for(let i=0;i<=4;i++){const y=H-16-(i/4)*(H-24);
    ctx.beginPath();ctx.moveTo(6,y);ctx.lineTo(W-6,y);ctx.stroke();}
  fields.forEach((k,fi)=>{
    const c = CC[fi%CC.length];
    const vals = obs.map(o=> +o[k]).filter(v=>v===v);
    if(!vals.length) return;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const span = (hi-lo) || 1;
    ctx.strokeStyle = c; ctx.shadowColor=c; ctx.shadowBlur=6; ctx.lineWidth=1.5;
    ctx.beginPath();
    let started = false;
    obs.forEach((o,i)=>{
      const v = +o[k]; if(v!==v) return;
      const x = 6 + i/Math.max(1,obs.length-1)*(W-12);
      const y = H-16 - ((v-lo)/span)*(H-24);
      if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
    });
    ctx.stroke(); ctx.shadowBlur=0;
    const last = vals[vals.length-1];
    ctx.fillStyle = '#9db0cc'; ctx.font = '9px sans-serif';
    ctx.fillText(k + ' = ' + (Math.abs(last)>1000? last.toFixed(0): last.toFixed(3)), 8, 12+fi*12);
  });
  showDiag(obs);
}

function showDiag(obs){
  const last = obs[obs.length-1] || {};
  const rows = Object.entries(last).map(([k,v])=>{
    if(typeof v === 'number') return k+': '+(Math.abs(v)>1000? v.toFixed(1): v.toFixed(4));
    if(Array.isArray(v)) return k+': ['+v.slice(0,6).map(x=>typeof x==='number'? (+x).toFixed(2):x).join(', ')+(v.length>6?', …':'')+']';
    if(v && typeof v==='object') return k+': {…}';
    return k+': '+String(v).slice(0,40);
  });
  $('diag').innerHTML = rows.map(r=>'• '+r).join('<br>') || '—';
}

$('search').addEventListener('input', e=>{query=e.target.value; renderList();});
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); filter = b.dataset.f; renderList();
  };
});
$('runbtn').onclick = run;
$('chatTx').addEventListener('keydown', e=>{if(e.key==='Enter')sendChat();});

function pushBot(t){const c=$('chat');const d=document.createElement('div');d.className='m a';d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
async function sendChat(){
  const tx=$('chatTx');const text=tx.value.trim();if(!text)return;tx.value='';
  const c=$('chat');
  const d=document.createElement('div');d.className='m u';d.textContent=text;c.appendChild(d);
  c.scrollTop=c.scrollHeight;
  try{
    // 先走 DAYAN Agent（规则路由，无 LLM 依赖）
    const ra=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    const da=await ra.json();
    if(da.ok !== undefined){
      (da.summary||[]).forEach(s=>pushBot(s));
      if(da.intent) pushBot('[planner:'+da.planner+' intent:'+da.intent+']');
      return;
    }
    throw new Error('agent unavailable');
  }catch(e1){
    // 回退：LLM 助手（需 LM Studio）
    try{
      const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:text,history:[]})});
      const d2=await r.json();
      pushBot(d2.reply||'…');
    }catch(e2){pushBot('连接失败');}
  }
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
